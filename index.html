<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>AIREP Visualization Platform</title>


    <!-- LOCAL CSS -->
    <link rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">


    <!-- LEAFLET -->
    <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />


    <!-- noUiSlider -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/nouislider@15.7.1/dist/nouislider.min.css">

</head>

<body>


    <!-- TOPBAR -->
    <div id="topbar">

        <div class="top-left">
            ✈ AIREP Visualization Platform
        </div>


        <div class="top-center">
            UTC Dashboard
        </div>


        <div class="top-right">

            <button class="top-btn">
                Layers
            </button>

            <button class="top-btn">
                Help
            </button>

        </div>

    </div>



    <!-- SIDEBAR -->
    <div id="sidebar">

        <div class="panel">

            <h2>Filters</h2>

<!-- UTC DATE FILTER -->

<div class="filter-block">

    <div class="filter-header">

        <span>
            Date-Time Range (UTC)
        </span>

    </div>


    <div class="datetime-grid">

        <div class="datetime-box">

            <label>Start</label>

            <input
                type="datetime-local"
                id="start-time"
            >

        </div>


        <div class="datetime-box">

            <label>End</label>

            <input
                type="datetime-local"
                id="end-time"
            >

        </div>

    </div>


    <div class="quick-select">

       <button class="quick-btn" data-hours="6">6H</button>
<button class="quick-btn" data-hours="12">12H</button>
<button class="quick-btn" data-hours="24">24H</button>
<button class="quick-btn active" data-hours="48">48H</button>
<button class="quick-btn" data-hours="168">7D</button>

    </div>

</div>


<!-- FLIGHT LEVEL -->
<div class="filter-block">

    <h3>Flight Level (FL)</h3>

    <div id="flight-slider"></div>

    <p id="flight-range"></p>

    <!-- FLIGHT HISTOGRAM -->
    <canvas id="flightChart"></canvas>

</div>

            <!-- TEMPERATURE -->
            <div class="filter-block">

                <h3>Temperature (°C)</h3>

                <div id="temp-slider"></div>

                <p id="temp-range"></p>

                <!-- HISTOGRAM -->
                <canvas id="tempChart"></canvas>

            </div>



            <!-- WIND -->
            <div class="filter-block">

                <h3>Wind Speed (KT)</h3>

                <div id="wind-slider"></div>

                <p id="wind-range"></p>

                <!-- HISTOGRAM -->
                <canvas id="windChart"></canvas>

            </div>



            <!-- RESET -->
            <button onclick="resetFilters()">

                Reset Filters

            </button>

        </div>

    </div>



    <!-- MAP -->
    <div id="map"></div>



    <!-- TEMPERATURE LEGEND -->
    <div id="temp-legend">

        <h4>Temperature</h4>

        <div class="legend-item blue">
            &lt; -40°C
        </div>

        <div class="legend-item cyan">
            -40 to -20
        </div>

        <div class="legend-item green">
            -20 to 0
        </div>

        <div class="legend-item yellow">
            0 to 20
        </div>

        <div class="legend-item red">
            &gt; 20
        </div>

    </div>



    <!-- BOTTOM PANEL -->
    <div id="bottom-panel">



        <!-- STATISTICS -->
        <div class="bottom-card">

            <h4>Statistics</h4>


            <div class="stat-row">

                <span>Aircraft Visible</span>

                <span id="visible-count">
                    0
                </span>

            </div>


            <div class="stat-row">

                <span>Average Temp</span>

                <span id="avg-temp">
                    0
                </span>

            </div>


            <div class="stat-row">

                <span>Maximum Wind</span>

                <span id="max-wind">
                    0
                </span>

            </div>

        </div>




        <!-- LAYER CONTROLS -->
        <div class="bottom-card">

            <h4>Layer Controls</h4>



            <div class="toggle-row">

                <label>

                    <input
                        type="checkbox"
                        id="toggle-temp"
                        checked>

                    Temperature Labels

                </label>

            </div>



            <div class="toggle-row">

                <label>

                    <input
                        type="checkbox"
                        id="toggle-wind"
                        checked>

                    Wind Arrows

                </label>

            </div>



            <div class="toggle-row">

                <label>

                    <input
                        type="checkbox"
                        id="toggle-points"
                        checked>

                    Observation Points

                </label>

            </div>

        </div>

    </div>



    <!-- MINIMAP -->
    <div id="minimap"></div>



    <!-- LEAFLET -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>



    <!-- noUiSlider -->
    <script src="https://cdn.jsdelivr.net/npm/nouislider@15.7.1/dist/nouislider.min.js"></script>



    <!-- CHART.JS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>



    <!-- APP SCRIPT -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
